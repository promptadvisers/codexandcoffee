name: Build StageInk Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'day-13/app/windows/**'
      - '.github/workflows/stageink-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows app
        shell: pwsh
        run: dotnet publish day-13/app/windows/StageInk.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/StageInk-Windows-x64
      - name: Run Windows component and UI smoke checks
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'artifacts/windows-checks'
          $process = Start-Process 'artifacts/StageInk-Windows-x64/StageInk.exe' -ArgumentList @('--self-test', $report) -PassThru -Wait
          Get-Content "$report/summary.txt"
          if ($process.ExitCode -ne 0) { Get-Content "$report/results.json"; throw "StageInk checks failed ($($process.ExitCode))" }
      - name: Package Windows download
        shell: pwsh
        run: |
          Copy-Item day-13/app/windows/README.md artifacts/StageInk-Windows-x64/README.md
          Compress-Archive artifacts/StageInk-Windows-x64/* artifacts/StageInk-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StageInk-Windows-build
          path: artifacts/
          retention-days: 30

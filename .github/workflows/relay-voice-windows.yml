name: Build Relay Voice Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'day-13/relay-voice/**'
      - '.github/workflows/relay-voice-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: day-13/relay-voice
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: day-13/relay-voice
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned build dependencies
        run: |
          npm --prefix app/electron ci
          python -m pip install pyinstaller==6.22.3 certifi==2026.10.23
      - name: Test shared code
        run: |
          python -m unittest discover -s app -p test_backend.py
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed' }
          npm --prefix app/electron test
          if ($LASTEXITCODE -ne 0) { throw 'Electron tests failed' }
      - name: Build bundled providers and native Windows helper
        run: |
          python scripts/build-backend.py
          if ($LASTEXITCODE -ne 0) { throw 'Backend build failed' }
          dotnet publish app/windows/RelayHelper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o app/dist/windows-helper
          if ($LASTEXITCODE -ne 0) { throw 'Native helper build failed' }
          python -m PyInstaller --noconfirm --clean --onefile --name relay-fixture --distpath app/dist/tests --workpath app/dist/tests-work --specpath app/dist app/windows/tests/fixture_backend.py
          if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed' }
      - name: Test actual bundled Python executable without provider credentials
        run: python scripts/check-packaged-backend.py app/dist/backend/relay-backend/relay-backend.exe
      - name: Test Windows helper with isolated fictional requests
        run: python app/windows/tests/check_protocol.py app/dist/windows-helper/relay-voice-helper.exe app/dist/tests/relay-fixture.exe
      - name: Package Electron
        run: npm --prefix app/electron run package
      - name: Launch clean installed app
        run: |
          $env:RELAY_SMOKE_DIR = Join-Path $PWD 'app/dist/smoke'
          $process = Start-Process 'app/dist/electron/Relay-Voice-Windows-x64/Relay Voice.exe' -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'App smoke check timed out' }
          $report = Get-Content app/dist/smoke/smoke-report.json | ConvertFrom-Json
          if (-not $report.helperReady -or -not $report.historyEmpty -or -not $report.keysEmpty) { throw 'Clean launch failed' }
          if ($report.page.inputs.Count -ne 2) { throw 'Provider setup missing' }
          $report | ConvertTo-Json -Depth 8
      - name: Package learner download
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item README.md app/dist/electron/Relay-Voice-Windows-x64/README.md
          Copy-Item LICENSE app/dist/electron/Relay-Voice-Windows-x64/LICENSE
          Copy-Item THIRD-PARTY-NOTICES.md app/dist/electron/Relay-Voice-Windows-x64/THIRD-PARTY-NOTICES.md
          Compress-Archive app/dist/electron/Relay-Voice-Windows-x64/* artifacts/Relay-Voice-Windows-x64.zip
          Copy-Item app/dist/smoke/smoke-report.json artifacts/windows-smoke.json
          Copy-Item app/dist/smoke/setup.png artifacts/windows-setup.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relay-Voice-Windows-build
          path: |
            day-13/relay-voice/artifacts/
            day-13/relay-voice/app/dist/smoke/
          retention-days: 30

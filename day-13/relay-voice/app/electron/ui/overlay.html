<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>Relay Voice</title><link rel="stylesheet" href="overlay.css"></head>
<body><section class="pill" aria-label="Relay Voice status">

</section><script type="module" src="overlay.js"></script></body></html>

text x="0" y="24.668" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="28px" fill="#386da1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">11 skills + connections →</text></g></g></a></svg></section></main></div><script>const buttons=[...document.querySelectorAll('button')],parts=[...document.querySelectorAll('.part')];let current=0;function go(i){current=Math.max(0,Math.min(parts.length-1,i));document.getElementById('jump').value=current;buttons.forEach((b,j)=>{b.classList.toggle('active',j===current)});parts.forEach((p,j)=>p.classList.toggle('active',j===current));location.hash='part-'+current}buttons.forEach((b,i)=>b.onclick=()=>go(i));document.getElementById('jump').onchange=e=>go(Number(e.target.value));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});go(parseInt(location.hash.replace('#part-',''))||0);</script></html>
